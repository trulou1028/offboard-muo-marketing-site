name: Marketing site quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketing-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # Plan 016 step 5. Unlike the two jobs above (which deliberately run with
  # NO Supabase env vars, proving the committed-content fallback path in
  # src/lib/content/posts.ts stays green without a database — see
  # docs/cms-architecture.md contract 1), this job runs the local Supabase
  # stack and exercises the real database path: applying
  # supabase/migrations/*.sql + supabase/seed.sql, then running the suite
  # again with NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  # pointed at it. This is also the first real application of the plan 016
  # step 2 migration + seed: Docker was unavailable in the environment that
  # authored them, so this job is what actually proves they apply cleanly
  # via `supabase db reset` (not just the manual bare-Postgres probe noted
  # in that commit's message).
  #
  # The "build against the database" step below FAILS the job if the build
  # actually ran through the fallback instead of the database (grepping the
  # "posts: db" / "posts: fallback" marker src/lib/content/posts.ts logs) —
  # not just a comment asking someone to watch for it. That check earns its
  # place here: the fallback is deliberately silent, so on the first real
  # run of this job it stayed green while quoting bug in the env-export step
  # below made the DB fetch fail and fall through unnoticed. Fixed in both
  # places; this job now fails loudly instead of passing quietly if it
  # regresses.
  cms-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --yes
      - name: Fail on schema drift between supabase/migrations and the reset database
        # supabase db diff has no --check flag in the installed CLI
        # (verified against `supabase db diff --help`, CLI 2.115.0) despite
        # earlier plan drafts assuming one — this reproduces the same intent
        # (non-empty diff output means an untracked schema change) without
        # relying on a flag that doesn't exist.
        run: |
          diff_output="$(supabase db diff --local)"
          if [ -n "$diff_output" ]; then
            echo "$diff_output"
            echo "::error::Schema drift detected between supabase/migrations and the local database after 'supabase db reset'."
            exit 1
          fi
      - name: Export the local stack's URL + anon key
        # Dot-paths verified against the installed CLI's own --help example
        # (api.url) and its Go source's struct tags for the anon key field
        # (auth.anon_key) — not guessed from documentation alone, since this
        # environment has no Docker and so cannot run `supabase status` to
        # confirm the output directly.
        #
        # `supabase status -o env` emits shell-style KEY="value" lines, but
        # $GITHUB_ENV does not strip quotes — it takes everything after `=`
        # literally — so appending its output directly makes
        # NEXT_PUBLIC_SUPABASE_URL literally `"http://127.0.0.1:54321"`,
        # quote characters included, which `new URL()` then rejects. Caught
        # on this job's first real CI run: the build log showed
        # `Failed to parse URL from "http://127.0.0.1:54321"/rest/v1/...`
        # with the stray quote visible right there, and the run fell through
        # to the fallback path silently (the "build against the database"
        # step below did not exist yet on that run, or it would have failed
        # loudly instead). The sed strips the surrounding quotes as each
        # line is appended.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL (unquoted, for verification only): $NEXT_PUBLIC_SUPABASE_URL"
      - run: npm test
      - name: Build against the database and require the DB path
        # The fallback in src/lib/content/posts.ts is deliberately silent
        # (correct for production resilience against a real outage), which
        # means "no credentials" and "the DB read path is broken" produce an
        # identical green `npm run build` here unless something makes the
        # difference fatal. This job's entire point is to prove the database
        # path works, not just that the fallback still does (test-and-build
        # already proves that, unchanged, with zero credentials) — so a
        # build that quietly fell back must fail this job.
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q "posts: fallback" build.log; then
            echo "::error::cms-contract built from the committed fallback, not the database. The DB read path is broken."
            exit 1
          fi
          grep -q "posts: db" build.log || { echo "::error::No 'posts: db' marker in build output."; exit 1; }
