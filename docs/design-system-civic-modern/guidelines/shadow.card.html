<!-- @dsCard group="Spacing" viewport="700x160" name="The one shadow" subtitle="Flat cards get a hairline; floating overlays get 0 16px 40px rgba(10,17,16,0.12)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font:600 10px/1.3 var(--font-sans);letter-spacing:.04em}.lbl{font:600 10px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--secondary)}</style></head><body><div style="display:flex;gap:24px">
<div style="flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;font:400 13px/1.4 var(--font-sans);color:var(--body-muted)"><b style="color:var(--ink)">Flat in a grid</b><br>1px #D9D6CC, no shadow.</div>
<div style="flex:1;background:#fff;border-radius:20px;padding:16px;box-shadow:0 16px 40px rgba(10,17,16,0.12);font:400 13px/1.4 var(--font-sans);color:var(--body-muted)"><b style="color:var(--ink)">Floating overlay</b><br>No border, one soft shadow.</div></div></body></html>
